<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
</head>
<body>
    <!--- Calculadora básica en línea-->
    <h1>Calculadora Básica</h1>
    <form id="calculator">
        <input type="number" id="num1" placeholder="Número 1" required>
        <input type="number" id="num2" placeholder="Número 2" required>
        <select id="operation">
            <option value="add">Sumar</option>
            <option value="subtract">Restar</option>
            <option value="multiply">Multiplicar</option>
            <option value="divide">Dividir</option>
        </select>
        <button type="submit">Calcular</button>
    </form>
    <h2>Resultado: <span id="result">0</span></h2>
    <p>Desarrollado por: <a href="https://github.com/0koikoi" target="_blank">koi</a></p>
</body>
</html>
